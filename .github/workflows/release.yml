name: Build and release

# Builds ytui for Windows, Linux and macOS on every pull request (to check
# all platforms compile and the tests pass) and, for a tag like
# v2026.10.16, publishes the packages as a GitHub release.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Test
        shell: bash
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="ytui-${{ steps.ver.outputs.v }}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/ytui.exe" README.md LICENSE "dist/$pkg/"
          cd dist && 7z a -tzip "$pkg.zip" "$pkg" > /dev/null

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="ytui-${{ steps.ver.outputs.v }}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/ytui" README.md LICENSE "dist/$pkg/"
          cd dist && tar czf "$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes=".github/release-notes/$tag.md"
          args=(--title "ytui $tag" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$tag" dist/* "${args[@]}"
