[package]
name = "ytui"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/ytui"
description = "YouTube in the terminal: search, browse, and watch videos rendered as colour ASCII / Unicode mosaics"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "2"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
