[package]
name = "ytui"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/ytui"
description = "YouTube in the terminal: search, browse, and watch videos rendered as colour ASCII / Unicode mosaics"

[dependencies]
anyhow = "1"
crossterm = "0.28"
fontdue = "0.9"
ratatui = "0.29"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
