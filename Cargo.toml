[package]
name = "ytui"
version = "2026.10.17"
edition = "2021"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/ytui"
description = "YouTube in the terminal: a TUI YouTube client that plays video as ASCII art, Unicode mosaics, sixel or kitty graphics"
keywords = ["youtube", "tui", "terminal", "ascii", "sixel"]
categories = ["command-line-utilities", "multimedia::video"]
homepage = "https://github.com/bong-water-water-bong/ytui"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
flate2 = "1"
fontdue = "0.9"
getrandom = "0.2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
ureq = "2"
unicode-width = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
